services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - exports:/exports
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  frontend:
    build:
      context: ./flouze-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["full"]

  backend:
    build:
      context: ./flouze-backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flouze}
      POSTGRES_USER: ${POSTGRES_USER:-flouze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flouze}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flouze} -d ${POSTGRES_DB:-flouze}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  exports:
